log:
  loglevel: debug
inbounds:
  - listen: 0.0.0.0
    port: 443
    protocol: vless
    settings:
      clients:
        - id: "{{XRAY_UUID}}"
          level: 0
          email: general@vless-vision
          flow: xtls-rprx-vision
      decryption: none
      fallbacks:
        # fallback reality non vision connections to xhttp
        - dest: /dev/shm/xhttp.sock
          xver: 0
    streamSettings:
      network: raw
      security: reality
      realitySettings:
        # disable verbose logging
        show: false
        # Route target handshakes without terminating TLS.
        dest: /dev/shm/reality-target.sock
        xver: 0
        serverNames: {{REALITY_SERVER_NAMES}}
        privateKey: "{{XRAY_REALITY_PRIVATE_KEY}}"
        shortIds:
          # If this item exists, client shortId can be empty
          - ""
          # 0 to f, length is a multiple of 2, maximum length is 16
          - "{{XRAY_REALITY_SHORT_ID}}"
      # sockopt:
      #   tcpFastOpen: true
      #   tcpcongestion: bbr
      #   tcpMptcp: true
      #   tcpNoDelay: true
    tag: VISION+REALITY
    # sniffing:
    #   enabled: true
    #   destOverride:
    #     - http
    #     - tls
    #     - quic
    #   metadataOnly: false
    #   routeOnly: true
  - listen: /dev/shm/xhttp.sock,0666
    protocol: vless
    settings:
      clients:
        - id: "{{XRAY_UUID}}"
          level: 0
          email: general@vless-xhttp
      # VLESS Encryption ("Seed"): this inbound has no XTLS flow (Vision can't run
      # over xhttp), so the proxy-layer encryption is what migrates it off the
      # deprecated "VLESS with no Flow, etc." It also gives an inner E2E layer the
      # CDN can't read. Server holds the secret seed; clients carry the matching
      # public key. Rendered by the xray service from the ML-KEM-768 seed
      # (XRAY_VLESS_ENC_SEED).
      # NOTE: cannot be combined with "fallbacks" (that's why the VISION+REALITY
      # inbound above keeps "decryption": "none").
      decryption: "{{XRAY_VLESS_DECRYPTION}}"
    streamSettings:
      network: xhttp
      xhttpSettings:
        # It is recommended that the server does not verify the host, which will
        # allow the client to have more gameplay
        host: ""
        path: "{{XRAY_XHTTP_PATH}}"
        # The server is recommended to be set to auto, allowing all client
        # upload modes, which will give the client more gameplay
        mode: auto
        # The parameters in extra are already optimal by default and can be left
        # blank.
        extra:
          # Server only, set to true if there are compatibility issues
          noSSEHeader: false
          # Allows the client to carry 1MB of data per POST, only works in
          # packet-up mode
          scMaxEachPostBytes: 1000000
          # The server caches up to 30 POST requests, only in packet-up mode
          # (only set on the server)
          scMaxBufferedPosts: 30
          xPaddingBytes: 100-1000
      sockopt:
        tcpFastOpen: true
        # When using nginx for reverse proxying, it must be set to false (the
        # default is false, so it is optional)
        acceptProxyProtocol: false
        tcpcongestion: bbr
        tcpMptcp: true
        tcpNoDelay: true
        # Only honour a client-supplied X-Forwarded-For when this secret header
        # is present in the request. nginx stamps it on legitimate xhttp traffic
        # (see xhttp-server-common.conf); clients reaching this inbound through
        # the REALITY fallback cannot guess the header name and therefore cannot
        # spoof their source IP. Without this, Xray trusts X-Forwarded-For
        # implicitly (the "VERY INSECURE" startup warning).
        trustedXForwardedFor:
          - "{{XRAY_TRUSTED_XFF_HEADER}}"
    tag: XHTTP_IN
    # sniffing:
    #   enabled: true
    #   destOverride:
    #     - http
    #     - tls
    #     - quic
    #   metadataOnly: false
    #   routeOnly: true
  - tag: REALITY_TARGET
    listen: /dev/shm/reality-forward.sock,0666
    protocol: dokodemo-door
    settings:
      address: 0.0.0.0
      port: 443
      network: tcp
    streamSettings:
      network: raw
      security: none
    sniffing:
      enabled: true
      destOverride: [tls]
      routeOnly: false
outbounds:
  - tag: REALITY_LOCAL
    protocol: freedom
    settings:
      redirect: 127.0.0.1:8443
      finalRules:
        - action: allow
          network: tcp
          ip: [127.0.0.1]
          port: "8443"
        - action: block
          blockDelay: 0

  - tag: REALITY_AUTO_DIRECT
    protocol: freedom
    settings:
      domainStrategy: UseIP
      # Check concrete DNS answers before dialing; domain rules permit rebinding.
      finalRules:
        - action: block
          ip: [
            0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8,
            169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24,
            192.88.99.0/24, 192.168.0.0/16, 198.18.0.0/15,
            198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4,
            "2001::/23", "2001:db8::/32", "2002::/16", "3fff::/20",
            "{{PUBLIC_IP}}",
          ]
          blockDelay: 0
        - action: allow
          network: tcp
          ip: [0.0.0.0/0, "2000::/3"]
          port: "443"
        - action: block
          blockDelay: 0
routing:
  # Route sniffed names without resolving them first.
  domainStrategy: AsIs
  rules:
    # Failed sniffing leaves the sentinel address, which the relay blocks.
    # Never substitute the local certificate for an unreadable external SNI.
    - type: field
      inboundTag: [REALITY_TARGET]
      ip: [0.0.0.0]
      outboundTag: REALITY_AUTO_DIRECT

    - type: field
      inboundTag: [REALITY_TARGET]
      domain: {{REALITY_FORWARD_DOMAINS}}
      outboundTag: REALITY_AUTO_DIRECT

    # nginx handles owned names and no SNI; other unlisted names stay local.
    - type: field
      inboundTag: [REALITY_TARGET]
      outboundTag: REALITY_LOCAL
